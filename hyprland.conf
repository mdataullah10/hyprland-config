# --- MONITORS ---
monitor=,preferred,auto,1

# --- AUTOSTART ---
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = waybar
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = fcitx5 -d
exec-once = swww-daemon
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# --- INPUT ---
input {
    kb_layout = us
    kb_options =
    follow_mouse = 1
    
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# --- GENERAL & DECORATION ---
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(89b4faee) rgba(f5c2e7ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
    }
}

# --- ANIMATIONS ---
animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# --- WINDOW RULES ---
# Using the legacy blurls which is often more stable for Waybar
blurls = waybar

# --- KEYBINDINGS ---
$mainMod = SUPER

# Apps
bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, E, exec, dolphin
bind = $mainMod, D, exec, rofi -show drun
bind = $mainMod, B, exec, firefox
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, F, fullscreen,

# Management
bind = $mainMod, V, togglefloating,
bind = $mainMod, M, exit,
bind = $mainMod, Q, killactive,

# Screenshots & Recording
bind = $mainMod, S, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mainMod SHIFT, S, exec, grim - | wl-copy
bind = $mainMod, R, exec, pgrep gpu-screen-rec && (pkill -INT gpu-screen-rec && notify-send "Recorder" "Recording Saved") || (gpu-screen-recorder -w screen -f 60 -a default_output -o ~/Videos/Recording_$(date +'%Y-%m-%d_%H-%M-%S').mp4 && notify-send "Recorder" "Recording Started")

# Hardware Controls
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindle = , XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindle = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
